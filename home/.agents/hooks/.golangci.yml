# golangci-lint configuration for the agent guard hooks and droid generator.
#
# These rules decide whether a tool call runs at all, so the linter set leans on
# correctness -- unchecked errors, mishandled wrapping, dead branches -- over
# style. `make lint` runs it; `make fmt` applies the formatters below.
version: "2"

run:
  # Test files are part of the guard: the decision corpus and the per-rule
  # tables are what keep the rules honest, so they are linted too.
  tests: true

linters:
  # errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - errorlint # error comparisons that break on wrapped errors
    - gocritic
    - gosec
    - misspell
    - nilerr # returning nil after a non-nil error
    - revive
    - thelper # t.Helper() on test helpers, so failures point at the caller
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable:
        # Field order here is chosen for readability; these structs are a
        # handful of values decoded once per process, so padding is irrelevant.
        - fieldalignment
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

  exclusions:
    generated: lax
    rules:
      # The golden corpus is source-controlled test data, not a secret, so it is
      # written 0o644 like every other file in the repo.
      - path: _test\.go
        linters:
          - gosec
        text: G306

      # Reading a file the user named through $AGENT_HOOKS_CONFIG is what the
      # config loader is for, so the path being "tainted" is the feature. There
      # is no privilege boundary to cross: the hook already runs as the user who
      # set the variable, and it only ever reads the file.
      - path: internal/config/config\.go
        linters:
          - gosec
        text: "G(304|703)"

      # Running the command a project's .claude/hooks.json names is what the
      # quality hook is for. It runs as the user, over a repo the user is
      # already editing with Claude, which can run the same command anyway.
      - path: internal/quality/run\.go
        linters:
          - gosec
        text: G204

      # The grant tests run the commit-push-pr skill's own argument parser, a
      # script in this repo at a path fixed in the test, to pin that the two
      # parsers agree.
      - path: internal/grant/grant_test\.go
        linters:
          - gosec
        text: G204

      # The droid generator reads the agents dir and syncs the droids dir that
      # dot names on its command line; walking, reading and writing those paths
      # is the whole job, as the user who owns both. Droids are config, not
      # secrets: 0o755/0o644 like the files Droid writes there itself.
      - path: cmd/agent-droids/
        linters:
          - gosec
        text: "G(122|301|304|306|703)"

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gofumpt:
      extra:
        group-params: true
      # Without this, gofumpt reads `agent-hooks/...` as standard library --
      # its heuristic is a dot in the first path element, and this module is
      # local-only so it has no domain -- and folds those imports into the
      # stdlib group, against what gci wants.
      module-path: agent-hooks
    # gci rather than goimports: goimports and gofumpt disagree about import
    # grouping and rewrite each other's output, which makes the formatting check
    # report a different set of files on every invocation. gci states the
    # grouping explicitly and composes with gofumpt.
    gci:
      sections:
        - standard
        - default
        - prefix(agent-hooks)
      custom-order: true
