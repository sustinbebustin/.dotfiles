# Herdr configuration
# Managed in ~/.dotfiles and stowed to ~/.config/herdr/config.toml.
# Full reference: https://herdr.dev/docs/config-reference/
#
# Active values differ from Herdr's defaults. Default or unset values remain
# commented so this file also serves as a complete configuration reference.

# Show first-run setup on startup. Missing or true shows onboarding.
# Default: unset.
onboarding = false

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

[theme]
# Built-in theme name. Available themes include catppuccin, terminal,
# tokyo-night, dracula, nord, gruvbox, one-dark, solarized, kanagawa,
# rose-pine, and vesper.
# Default: "catppuccin".
# Dracula, with the Dracula Pro purple accent the tmux theme used.
name = "dracula"

# Follow the host terminal's light/dark appearance and switch themes.
# Default: false.
# auto_switch = false

# Theme used when auto_switch selects a dark appearance.
# Default: unset; Herdr uses the configured theme's dark sibling if available.
# dark_name = "catppuccin"

# Theme used when auto_switch selects a light appearance.
# Default: unset; Herdr uses the configured theme's light sibling if available.
# light_name = "catppuccin-latte"

[theme.custom]
# Override individual tokens from the base theme. Colors accept #rrggbb, named
# colors, rgb(r,g,b), or reset aliases such as reset, default, none, and
# transparent. Every custom token defaults to unset.

# Highlight and selection accent.
accent = "#9580FF"
# Sidebar and panel background.
# panel_bg = "reset"
# Desktop sidebar background, independent of other panel surfaces.
# sidebar_bg = "#181825"
# Background of the active Space and focused Agent sidebar rows.
# active_row_bg = "#1e1e2e"
# Background of the Navigate-mode cursor row in the sidebar.
# selection_bg = "#313244"
# Red semantic color.
# red = "#ff6188"
# Green semantic color.
# green = "#a6e3a1"

# Appearance-specific overrides layered on top when auto_switch is enabled.
# [theme.custom.light]
# panel_bg = "#eff1f5"
# text = "#4c4f69"
#
# [theme.custom.dark]
# panel_bg = "#1e1e2e"
# text = "#cdd6f4"

# -----------------------------------------------------------------------------
# Terminal
# -----------------------------------------------------------------------------

[terminal]
# Executable used for new interactive panes. Empty uses $SHELL, then /bin/sh.
# Default: "".
# default_shell = ""

# New-shell startup mode: "auto", "login", or "non_login". Auto uses login
# shells on macOS and non-login behavior elsewhere.
# Default: "auto".
# shell_mode = "auto"

# CWD policy for new panes, tabs, and workspaces: "follow", "home", "current",
# or a fixed path. Explicit --cwd values take precedence.
# Default: "follow".
# new_cwd = "follow"

# Render pane images in Kitty graphics-compatible outer terminals.
# Default: true.
# kitty_graphics = true

# -----------------------------------------------------------------------------
# Updates
# -----------------------------------------------------------------------------

[update]
# Release channel used by background checks and `herdr update`: "stable" or
# "preview".
# Default: "stable" on Linux/macOS and "preview" on Windows.
# channel = "stable"

# Check herdr.dev for new Herdr versions in the background.
# Default: true.
# version_check = true

# Check herdr.dev for remote agent-detection manifest updates. Bundled
# manifests and local overrides still apply when this is disabled.
# Default: true.
# manifest_check = true

# -----------------------------------------------------------------------------
# Keybindings
# -----------------------------------------------------------------------------
# Active bindings follow ~/.config/tmux/tmux.conf, or tmux's own defaults where
# it set none. Arrays give one action several shortcuts and keep Herdr's
# default alongside the tmux key.

[keys]
# Prefix key used to enter prefix mode. An array accepts several prefixes.
# Default: "ctrl+b".
# ctrl+b, plus Caps Lock+b: Karabiner maps Caps Lock to hyper
# (ctrl+alt+shift+cmd), which Warp sends as its own chord.
prefix = ["ctrl+b", "ctrl+alt+shift+cmd+b"]

# Open keybinding help.
# Default: "prefix+?".
# help = "prefix+?"

# Open settings.
# Default: "prefix+s".
# settings = "prefix+s"

# Create a workspace.
# Default: "prefix+shift+n".
# new_workspace = "prefix+shift+n"

# Create a Git worktree from the selected workspace.
# Default: "prefix+shift+g".
# new_worktree = "prefix+shift+g"

# Open an existing Git worktree from the selected workspace.
# Default: unset.
# open_worktree = ""

# Delete the selected managed worktree checkout after confirmation.
# Default: unset.
# remove_worktree = ""

# Rename the selected workspace.
# Default: "prefix+shift+w".
rename_workspace = ["prefix+$", "prefix+shift+w"]

# Close the selected workspace.
# Default: "prefix+shift+d".
# close_workspace = "prefix+shift+d"

# Open workspace navigation.
# Default: "prefix+w".
# workspace_picker = "prefix+w"

# Open the session navigator.
# Default: "prefix+g".
# goto = "prefix+g"

# Move workspace selection up in navigate mode.
# Default: "up".
# navigate_workspace_up = "up"

# Move workspace selection down in navigate mode.
# Default: "down".
# navigate_workspace_down = "down"

# Focus the pane to the left in navigate mode; Left is always an alias.
# Default: "h".
# navigate_pane_left = "h"

# Focus the pane below in navigate mode.
# Default: "j".
# navigate_pane_down = "j"

# Focus the pane above in navigate mode.
# Default: "k".
# navigate_pane_up = "k"

# Focus the pane to the right in navigate mode; Right is always an alias.
# Default: "l".
# navigate_pane_right = "l"

# Detach from server/client mode, or exit --no-session mode.
# Default: "prefix+q".
detach = ["prefix+d", "prefix+q"]

# Reload config.toml in the running app/server.
# Default: "prefix+shift+r".
reload_config = "prefix+r"

# Focus the target of the currently visible notification.
# Default: "prefix+o".
# open_notification_target = "prefix+o"

# Select the previous workspace.
# Default: unset.
previous_workspace = "prefix+("

# Select the next workspace.
# Default: unset.
next_workspace = "prefix+)"

# Focus the previous agent shown in the Agent panel.
# Default: unset.
# previous_agent = ""

# Focus the next agent shown in the Agent panel.
# Default: unset.
# next_agent = ""

# Focus Agent panel entries by index 1-9, e.g. "prefix+alt+1..9".
# Default: unset.
# focus_agent = ""

# Local-client shortcut that sends a clipboard image to a remote Herdr session.
# Only active in `herdr --remote`. Empty disables raw-key remote image paste.
# Default: "ctrl+v".
# remote_image_paste = "ctrl+v"

# Create a tab in the active workspace.
# Default: "prefix+c".
# new_tab = "prefix+c"

# Rename the active tab.
# Default: "prefix+shift+t".
rename_tab = ["prefix+comma", "prefix+shift+t"]

# Select the previous tab.
# Default: "prefix+p".
# previous_tab = "prefix+p"

# Select the next tab.
# Default: "prefix+n".
# next_tab = "prefix+n"

# Move the active tab one position toward the front.
# Default: unset.
# move_tab_previous = ""

# Move the active tab one position toward the back.
# Default: unset.
# move_tab_next = ""

# Switch to tab 1-9.
# Default: "prefix+1..9".
# switch_tab = "prefix+1..9"

# Switch to workspace 1-9 from prefix mode, e.g. "prefix+shift+1..9".
# Default: unset.
# switch_workspace = ""

# Close the active tab.
# Default: "prefix+shift+x".
close_tab = ["prefix+ampersand", "prefix+shift+x"]

# Rename the focused pane.
# Default: "prefix+shift+p".
# rename_pane = "prefix+shift+p"

# Open the focused pane's scrollback in $EDITOR.
# Default: "prefix+e".
# edit_scrollback = "prefix+e"

# Clear the focused pane, e.g. "prefix+ctrl+k".
# Default: unset.
# clear_pane = ""

# Enter keyboard copy mode for the focused pane.
# Default: "prefix+[".
copy_mode = "prefix+v"

# Focus the pane to the left.
# Default: "prefix+h".
focus_pane_left = ["prefix+left", "prefix+h"]

# Focus the pane below.
# Default: "prefix+j".
focus_pane_down = ["prefix+down", "prefix+j"]

# Focus the pane above.
# Default: "prefix+k".
focus_pane_up = ["prefix+up", "prefix+k"]

# Focus the pane to the right.
# Default: "prefix+l".
focus_pane_right = ["prefix+right", "prefix+l"]

# Swap the focused pane with the pane to the left.
# Default: "prefix+shift+h".
# swap_pane_left = "prefix+shift+h"

# Swap the focused pane with the pane below.
# Default: "prefix+shift+j".
# swap_pane_down = "prefix+shift+j"

# Swap the focused pane with the pane above.
# Default: "prefix+shift+k".
# swap_pane_up = "prefix+shift+k"

# Swap the focused pane with the pane to the right.
# Default: "prefix+shift+l".
# swap_pane_right = "prefix+shift+l"

# Cycle to the next pane.
# Default: "prefix+tab".
# cycle_pane_next = "prefix+tab"

# Cycle to the previous pane.
# Default: "prefix+shift+tab".
# cycle_pane_previous = "prefix+shift+tab"

# Focus the last-focused pane across workspaces and tabs.
# Default: unset.
last_pane = "prefix+;"

# Split the focused pane vertically (side by side / split right).
# Default: "prefix+v".
split_vertical = "prefix+\\"

# Split the focused pane horizontally (stacked / split down).
# Default: "prefix+minus".
split_horizontal = "prefix+enter"

# Close the focused pane.
# Default: "prefix+x".
# close_pane = "prefix+x"

# Toggle zoom for the focused pane. `fullscreen` is accepted as a legacy alias.
# Default: "prefix+z".
zoom = "prefix+m"

# Enter pane resize mode.
# Default: "prefix+r".
resize_mode = "prefix+shift+r"

# Resize the focused pane toward the left without entering resize mode.
# Unlike tmux's `bind -r`, each step needs the prefix again; use resize mode
# for repeated steps.
# Default: unset.
resize_pane_left = ["prefix+[", "prefix+alt+left"]

# Resize the focused pane downward without entering resize mode.
# Default: unset.
resize_pane_down = ["prefix+minus", "prefix+alt+down"]

# Resize the focused pane upward without entering resize mode.
# Default: unset.
resize_pane_up = ["prefix+=", "prefix+alt+up"]

# Resize the focused pane toward the right without entering resize mode.
# Default: unset.
resize_pane_right = ["prefix+]", "prefix+alt+right"]

# Toggle sidebar collapse.
# Default: "prefix+b".
# toggle_sidebar = "prefix+b"

# Custom commands use the normal binding syntax. Types are `shell` for a
# detached process, `pane` for a temporary pane, `popup` for a modal terminal,
# and `plugin_action` for an installed plugin action. Popup commands may also
# specify width and height in cells or percentages.
# [[keys.command]]
# key = "prefix+alt+g"
# type = "popup"
# command = "lazygit"
# width = "80%"
# height = "80%"

# tmux break-pane: move the focused pane into a new tab.
[[keys.command]]
key = "prefix+!"
type = "shell"
command = "herdr pane move \"$(herdr pane list | jq -r '[.result.panes[] | select(.focused)][0].pane_id')\" --new-tab --focus"

# Legacy indexed shortcuts are parsed for compatibility. Prefer switch_tab,
# switch_workspace, and focus_agent in new configurations.
# [keys.indexed]
# Modifier combo making 1-9 switch tabs directly.
# Default: unset.
# tabs = ""
# Modifier combo making 1-9 switch workspaces directly.
# Default: unset.
# workspaces = ""
# Modifier combo making 1-9 focus Agent panel entries directly.
# Default: unset.
# agents = ""

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------

# [server]
# Virtual terminal width used for layout and new panes while no client is
# attached. Attached clients always use their own terminal size.
# Default: 120.
# headless_cols = 120

# Virtual terminal height used for layout and new panes while no client is
# attached. Attached clients always use their own terminal size.
# Default: 40.
# headless_rows = 40

# -----------------------------------------------------------------------------
# Worktrees
# -----------------------------------------------------------------------------

# [worktrees]
# Root directory for <repo>/<branch-slug> worktree checkouts.
# Default: "~/.herdr/worktrees".
# directory = "~/.herdr/worktrees"

# -----------------------------------------------------------------------------
# UI and sidebar
# -----------------------------------------------------------------------------

[ui]
# Default expanded sidebar width in columns; auto-scales for workspace names.
# Default: 26.
# sidebar_width = 26

# Minimum expanded sidebar width in columns.
# Default: 18.
# sidebar_min_width = 18

# Maximum expanded sidebar width in columns.
# Default: 36.
# sidebar_max_width = 36

# Start Herdr with the sidebar collapsed; takes effect on the next launch.
# Default: false.
# sidebar_start_collapsed = false

# Collapsed sidebar presentation: "compact" keeps the status rail and "hidden"
# uses zero width.
# Default: "compact".
# sidebar_collapsed_mode = "compact"

# Width at or below which Herdr uses its mobile single-column layout. Increase
# for foldables, tablets, or wide phone terminals.
# Default: 64.
# mobile_width_threshold = 64

# Capture mouse input for Herdr's mouse UI. Pane apps that request mouse input
# can still receive it. False lets the terminal handle clicks, such as
# Cmd-clicking URLs.
# Default: true.
# mouse_capture = true

# Copy text selected by mouse drag. When off, the selection stays until Ctrl+C
# (or Cmd+C when the host forwards it) copies and clears it.
# Default: true.
# copy_on_select = true

# Host cursor policy: "auto", "native", or "drawn". Auto uses a drawn cursor
# on native Windows/WSL and the terminal's native cursor elsewhere.
# Default: "auto".
# host_cursor = "auto"

# Modifier that passes right-click gestures through to pane apps. Shift is
# unsupported. Empty disables passthrough.
# Default: "".
# right_click_passthrough_modifier = ""

# Force a full host-terminal redraw when the outer terminal regains focus.
# Disabling may reduce flashing but leave rare corruption until the next redraw.
# Default: true.
# redraw_on_focus_gained = true

# Scrollback lines moved per mouse-wheel notch.
# Default: 3.
# mouse_scroll_lines = 3

# Ask for confirmation before closing a workspace.
# Default: true.
# confirm_close = true

# Ask for a name before creating a tab.
# Default: true.
# prompt_new_tab_name = true

# Ask for a name before interactively creating a workspace.
# Default: false.
# prompt_new_workspace_name = false

# Borders around split panes: "auto" only for split panes, "always" also frames
# a lone pane (while pane_outer_borders is on), "off" disables them. Legacy
# booleans still parse: true = "auto", false = "off".
# Default: "auto".
# pane_borders = "auto"

# Draw borders along the outside edge of the pane area. Disable this and pane
# gaps for tmux-style internal splitters without an outside frame.
# Default: true.
# pane_outer_borders = true

# Draw interactive scrollbars beside panes. Disable to reclaim their column and
# keep scrollbars out of terminal-native selections.
# Default: true.
# pane_scrollbars = true

# Visually separate split panes instead of sharing divider borders.
# Default: true.
# pane_gaps = true

# Show detected Agent labels in pane borders when no manual label is set.
# Default: false.
# show_agent_labels_on_pane_borders = false

# Hide the tab row when the workspace has exactly one tab.
# Default: false.
# hide_tab_bar_when_single_tab = false

# Desktop tab-row placement: "top" or "bottom".
# Default: "top".
# tab_bar_position = "top"

# Ordered right-aligned tab-bar entries. Supported types are zoom, hostname,
# datetime, text, and command; hostname, datetime, and command resolve on the
# Herdr server.
# Default: [].
# Mirrors the tmux status-right: time and date.
tab_bar_right = [
  { type = "zoom" },
  { type = "datetime", format = "%H:%M" },
  { type = "datetime", format = "%d-%b" },
]

# Text inserted between visible right-aligned tab-bar entries.
# Default: " ".
tab_bar_right_separator = " | "

# Outer terminal title. Tokens are {hostname}, {workspace}, {tab}, {pane}, and
# {terminal_title}; doubled braces produce literal braces. Empty leaves it alone.
# Default: "{hostname}: {workspace}".
# window_title = "{hostname}: {workspace}"

# Agent sidebar ordering: "spaces" groups by workspace; "priority" creates an
# attention queue. "workspaces" is accepted as an alias for "spaces".
# Default: "spaces".
# agent_panel_sort = "spaces"

# Agent-state markers: "dots" uses compact colored marks; "symbols" uses
# distinct static glyphs for blocked, working, done, idle, and unknown states.
# Default: "dots".
# status_indicators = "dots"

# Accent color for highlights, borders, and navigation UI. Accepts #rrggbb,
# named colors, or rgb(r,g,b).
# Default: "cyan".
# accent = "cyan"

# [ui.sidebar.agents]
# Blank rows between expanded Agent entries.
# Default: 0.
# row_gap = 0

# Expanded Agent layout. Built-in tokens: state_icon, state_text, machine,
# workspace, tab, pane, agent, terminal_title, and terminal_title_stripped.
# `$name` reads custom pane metadata. A token can be styled with an inline
# table such as { token = "workspace", fg = "#89b4fa", bold = true, dim = false }.
# Default: [["state_icon", "machine", "workspace", "tab"], ["agent"]].
# rows = [["state_icon", "machine", "workspace", "tab"], ["agent"]]

# Complete Agent-row overrides keyed by canonical Agent ID. Agents without an
# override use ui.sidebar.agents.rows.
# Default: {}.
# [ui.sidebar.agents.rows_by_agent]
# claude = [["state_icon", "machine", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

# [ui.sidebar.spaces]
# Blank rows between expanded Space entries.
# Default: 0.
# row_gap = 0

# Expanded Space layout. Built-in tokens: state_icon, state_text, workspace,
# branch, and git_status. `$name` reads custom workspace metadata. Inline token
# style tables support fg, bold, and dim.
# Default: [["state_icon", "workspace"], ["branch", "git_status"]].
# rows = [["state_icon", "workspace"], ["branch", "git_status"]]

# -----------------------------------------------------------------------------
# Notifications
# -----------------------------------------------------------------------------

# [ui.toast]
# Popup delivery: "off", in-app "herdr", outer-terminal "terminal", or direct
# OS "system" notifications.
# Default: "off".
# delivery = "off"

# Delay before finished or needs-input Agent notifications. Herdr sends only if
# the pane remains in that state.
# Default: 1.
# delay_seconds = 1

# [ui.toast.herdr]
# In-app toast position: top-left, top-right, bottom-left, or bottom-right.
# Default: "bottom-right".
# position = "bottom-right"

# [ui.toast.clipboard]
# Show the copied-to-clipboard popup after mouse copy.
# Default: true.
# enabled = true

# Clipboard popup position: top-left, top-center, top-right, bottom-left,
# bottom-center, or bottom-right.
# Default: "bottom-center".
# position = "bottom-center"

# -----------------------------------------------------------------------------
# Sound
# -----------------------------------------------------------------------------

# [ui.sound]
# Play sounds when Agents change state in background workspaces.
# Default: true.
# enabled = true

# MP3 used for every notification sound. Relative paths resolve from this file.
# Default: unset.
# path = "sounds/notification.mp3"

# MP3 overriding only finished notifications.
# Default: unset.
# done_path = "sounds/done.mp3"

# MP3 overriding only needs-input notifications.
# Default: unset.
# request_path = "sounds/request.mp3"

# Per-Agent sound policy: "default", "on", or "off". Droid is muted by default.
# [ui.sound.agents]
# droid = "off"

# -----------------------------------------------------------------------------
# Session restore
# -----------------------------------------------------------------------------

# [session]
# Resume supported AI-Agent panes into native conversations after restoring a
# Herdr session. Requires an integration that reports native session refs.
# Default: true.
# resume_agents_on_restore = true

# Milliseconds between automatic agent restores; 0 starts them without spacing.
# Default: 100.
# startup_per_agent_delay_ms = 100

# -----------------------------------------------------------------------------
# Remote attach
# -----------------------------------------------------------------------------

# [remote]
# Add keepalive fallbacks and private connection reuse for `herdr --remote`.
# False runs plain ssh using the user's SSH configuration unchanged.
# Default: true.
# manage_ssh_config = true

# -----------------------------------------------------------------------------
# Advanced
# -----------------------------------------------------------------------------

# [advanced]
# Maximum scrollback bytes retained per pane terminal.
# Default: 10000000.
# scrollback_limit_bytes = 10000000

# -----------------------------------------------------------------------------
# Experimental
# -----------------------------------------------------------------------------

[experimental]
# Allow launching Herdr inside an existing Herdr pane.
# Default: false.
# allow_nested = false

# Persist recent pane screen history across full server restarts. Saved output
# may contain secrets.
# Default: false.
# tmux-resurrect's capture-pane-contents equivalent.
pane_history = true

# Temporarily switch the host input source to an ASCII-capable mode while
# prefix mode is active, then restore it. macOS and Windows only.
# Default: false.
# switch_ascii_input_source_in_prefix = false

# Reveal a focused pane's hidden cursor anchor so macOS CJK input-method
# candidate windows track TUIs that draw their own cursor.
# Default: false.
# reveal_hidden_cursor_for_cjk_ime = false

# Limit hidden-cursor reveal to these detected Agents. Empty means any focused
# pane.
# Default: [].
# cjk_ime_agents = []

# IME anchor cursor shape: block, steady_block, underline, steady_underline,
# bar, or steady_bar.
# Default: "steady_block".
# cjk_ime_cursor_shape = "steady_block"
