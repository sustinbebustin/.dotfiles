<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untitled artifact</title>
  <style>
    :root {
      --ivory:    #FAF9F5;
      --slate:    #141413;
      --clay:     #D97757;
      --oat:      #E3DACC;
      --olive:    #788C5D;
      --rust:     #B04A3F;
      --gray-150: #F0EEE6;
      --gray-300: #D1CFC5;
      --gray-500: #87867F;
      --gray-700: #3D3D3A;
      --white:    #FFFFFF;

      --serif: ui-serif, Georgia, 'Times New Roman', serif;
      --sans:  system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --mono:  ui-monospace, 'SF Mono', Menlo, Monaco, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--sans);
      background: var(--ivory);
      color: var(--gray-700);
      line-height: 1.55;
      padding: 56px 32px 96px;
      -webkit-font-smoothing: antialiased;
    }

    .page { max-width: 1120px; margin: 0 auto; }

    /* ---------- header ---------- */
    header.page-head { margin-bottom: 48px; max-width: 760px; }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gray-500);
      margin-bottom: 12px;
    }

    h1 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 38px;
      line-height: 1.15;
      color: var(--slate);
      margin-bottom: 18px;
      letter-spacing: -0.01em;
    }

    .lead {
      font-size: 15px;
      line-height: 1.6;
      color: var(--gray-700);
      max-width: 640px;
    }

    /* ---------- sections ---------- */
    section { margin-bottom: 48px; }

    h2 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 22px;
      color: var(--slate);
      margin: 0 0 14px;
      letter-spacing: -0.01em;
    }

    /* ---------- shared primitives ---------- */
    .card {
      background: var(--white);
      border: 1.5px solid var(--gray-300);
      border-radius: 12px;
      padding: 24px;
    }

    .chip {
      display: inline-block;
      font-family: var(--mono);
      font-size: 11.5px;
      background: var(--gray-150);
      border: 1.5px solid var(--gray-300);
      color: var(--gray-700);
      padding: 5px 10px;
      border-radius: 8px;
      white-space: nowrap;
    }

    code {
      font-family: var(--mono);
      font-size: 0.92em;
      background: var(--gray-150);
      padding: 1px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="page">

    <header class="page-head">
      <div class="eyebrow">Context &middot; Subject</div>
      <h1>Page title in serif.</h1>
      <p class="lead">One or two sentences of framing, in body sans. Replace with real content grounded in the user's actual request &mdash; no lorem ipsum, no placeholder names.</p>
    </header>

    <section>
      <h2>Section heading</h2>
      <div class="card">
        Replace this content.
      </div>
    </section>

  </div>
</body>
</html>
