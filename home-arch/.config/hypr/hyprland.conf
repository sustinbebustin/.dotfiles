# ── Monitor ───────────────────────────────────────────────────
monitor = DP-3, 5120x1440@144, auto, 1

# ── Environment ───────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_BACKEND,wayland
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# ── Autostart ─────────────────────────────────────────────────
exec-once = waybar
exec-once = swaync
exec-once = hyprpaper
exec-once = hypridle
exec-once = walker --gapplication-service
exec-once = elephant
exec-once = hyprsunset
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = wl-clip-persist --clipboard regular
exec-once = systemctl --user start hyprpolkitagent
exec-once = udiskie &
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ── Input ─────────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

# ── General ───────────────────────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(ffffffee)
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

# ── Decoration ────────────────────────────────────────────────
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 3
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# ── Animations ────────────────────────────────────────────────
animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = windows, 1, 7, ease
    animation = windowsOut, 1, 7, ease, popin 80%
    animation = fade, 1, 7, ease
    animation = workspaces, 1, 6, ease
}

# ── Misc ─────────────────────────────────────────────────────
misc {
    vfr = true
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ── Layout ────────────────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
}

# ── Workspace persistence ────────────────────────────────────
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true

# ── Keybinds ──────────────────────────────────────────────────
$mod = SUPER

bind = $mod, Return, exec, ghostty
bind = $mod, Q, killactive
bind = $mod SHIFT, M, exit
bind = $mod, E, exec, thunar
bind = $mod SHIFT, V, togglefloating
bind = $mod, Space, exec, walker
bind = $mod, P, pseudo
bind = $mod, J, layoutmsg, togglesplit
bind = $mod SHIFT, F, fullscreen

# Move focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Move windows (Hyper = CapsLock hold via kanata)
bind = CTRL SHIFT ALT SUPER, left, movewindow, l
bind = CTRL SHIFT ALT SUPER, right, movewindow, r
bind = CTRL SHIFT ALT SUPER, up, movewindow, u
bind = CTRL SHIFT ALT SUPER, down, movewindow, d

# Resize windows
binde = $mod CTRL, right, resizeactive, 20 0
binde = $mod CTRL, left, resizeactive, -20 0
binde = $mod CTRL, up, resizeactive, 0 -20
binde = $mod CTRL, down, resizeactive, 0 20

# Mouse binds
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshot
bind = , Print, exec, grimblast --notify copysave area
bind = SHIFT, Print, exec, grimblast --notify copysave output

# Lock
bind = $mod CTRL, Q, exec, hyprlock

# Volume
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Media
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Notification center toggle
bind = $mod SHIFT, N, exec, swaync-client -t -sw

# Blue light filter
bind = $mod SHIFT, S, exec, hyprctl hyprsunset temperature 4500
bind = $mod SHIFT ALT, S, exec, hyprctl hyprsunset identity

